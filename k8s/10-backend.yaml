apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below 2 healthy pods during an update
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: __REGISTRY__/shopflow-backend:__TAG__
          ports: [{ containerPort: 3000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: db-secret, key: DATABASE_URL } }
            - name: DB_SSL
              value: "true"
            - name: DB_POOL_MAX
              value: "10"
          readinessProbe:               # "ready for traffic?" (needs the DB)
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                # "still alive?" (restart me if not)
            httpGet: { path: /live, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend            # nginx talks to this name
  namespace: shopflow
spec:
  selector: { app: backend }
  ports: [{ port: 3000, targetPort: 3000 }]
