<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopFlow</title>
<style>
  :root { --bg:#f4f1ec; --ink:#1d2327; --muted:#69727a; --line:#d9d3c9; --card:#fffdf9; --accent:#a8431d; --ok:#2c7a4b; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161412; --ink:#ece8e1; --muted:#9a948a; --line:#332e29; --card:#1f1c19; --accent:#e3855d; --ok:#5fc08a; --bad:#f08278; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Georgia, serif; }
  main { max-width:900px; margin:0 auto; padding:32px 20px 64px; }
  h1 { margin:0; font-size:2rem; } h2 { font-size:1.15rem; margin:32px 0 10px; }
  .sub { color:var(--muted); margin:2px 0 8px; }
  .badge { font:13px system-ui, sans-serif; border:1px solid var(--line); padding:2px 10px; border-radius:999px; display:inline-block; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); font-size:15px; }
  th { font:600 12px system-ui, sans-serif; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  input, select, button { font:inherit; }
  input[type=number] { width:70px; padding:5px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:4px; }
  select { padding:8px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:4px; }
  button { font:600 14px system-ui, sans-serif; padding:9px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button.small { padding:4px 10px; background:none; color:var(--accent); border:1px solid var(--line); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  #msg { min-height:1.5em; font:14px system-ui, sans-serif; margin-top:8px; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>ShopFlow</h1>
  <p class="sub">Browser → nginx → API → PostgreSQL</p>
  <span id="health" class="badge">checking…</span>

  <h2>Products</h2>
  <div class="scroll"><table>
    <thead><tr><th>SKU</th><th>Name</th><th>Price</th><th>In stock</th><th>Qty</th></tr></thead>
    <tbody id="products"></tbody>
  </table></div>
  <div class="row">
    <label for="customer">Customer</label><select id="customer"></select>
    <button id="place">Place order</button>
  </div>
  <div id="msg" role="status"></div>

  <h2>Recent orders</h2>
  <div class="scroll"><table>
    <thead><tr><th>#</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr></thead>
    <tbody id="orders"></tbody>
  </table></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const money = (c) => "₹" + (c / 100).toFixed(2);
async function call(path, opts) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = r.status === 204 ? null : await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data && data.error ? data.error : "request failed");
  return data;
}
const cell = (tr, text) => { const td = document.createElement("td"); td.textContent = text; tr.appendChild(td); return td; };
const say = (t, bad) => { $("msg").textContent = t; $("msg").className = bad ? "bad" : "ok"; };

async function health() {
  try { await call("/api/products?limit=1"); $("health").textContent = "API and database connected"; $("health").className = "badge ok"; }
  catch { $("health").textContent = "API unreachable"; $("health").className = "badge bad"; }
}
async function loadProducts() {
  const rows = await call("/api/products?limit=100");
  $("products").innerHTML = "";
  rows.forEach((p) => {
    const tr = document.createElement("tr");
    cell(tr, p.sku); cell(tr, p.name); cell(tr, money(p.price_cents)); cell(tr, p.stock);
    const td = document.createElement("td");
    const inp = Object.assign(document.createElement("input"), { type: "number", min: 0, max: p.stock, value: 0 });
    inp.dataset.id = p.id; inp.setAttribute("aria-label", "Quantity of " + p.name);
    td.appendChild(inp); tr.appendChild(td); $("products").appendChild(tr);
  });
}
async function loadCustomers() {
  const rows = await call("/api/customers");
  $("customer").innerHTML = "";
  rows.forEach((c) => $("customer").appendChild(Object.assign(document.createElement("option"), { value: c.id, textContent: c.name })));
}
async function loadOrders() {
  const rows = await call("/api/orders?limit=10");
  $("orders").innerHTML = "";
  rows.forEach((o) => {
    const tr = document.createElement("tr");
    cell(tr, o.id); cell(tr, o.customer_name); cell(tr, money(o.total_cents)); cell(tr, o.status);
    const td = document.createElement("td");
    if (o.status === "placed") {
      const b = Object.assign(document.createElement("button"), { className: "small", textContent: "Cancel" });
      b.onclick = async () => { try { await call(`/api/orders/${o.id}/cancel`, { method: "POST" }); say("Order cancelled, stock returned."); refresh(); } catch (e) { say(e.message, true); } };
      td.appendChild(b);
    }
    tr.appendChild(td); $("orders").appendChild(tr);
  });
}
$("place").onclick = async () => {
  const items = [...document.querySelectorAll("#products input")].filter((i) => +i.value > 0).map((i) => ({ product_id: +i.dataset.id, qty: +i.value }));
  if (!items.length) return say("Pick a quantity for at least one product.", true);
  try { const o = await call("/api/orders", { method: "POST", body: JSON.stringify({ customer_id: +$("customer").value, items }) }); say(`Order #${o.id} placed.`); refresh(); }
  catch (e) { say(e.message, true); }
};
const refresh = () => Promise.all([loadProducts(), loadOrders()]).catch(() => say("Could not load data.", true));
health(); loadCustomers().catch(() => {}); refresh();
</script>
</body>
</html>
